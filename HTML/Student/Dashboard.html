<!doctype html>
<html lang="en">
  <head>
    <!-- Set page metadata and load the stylesheet and application script. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3e9" />
    <meta
      name="description"
      content="Look at classes, grades,and manage student enrollment in Student Dashboard."
    />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script type="module" src="{{ url_for('static', filename='student.js') }}"></script>
  </head>
  <body>
    <main class="page-shell">
      <!-- Introduce the Student Dashboard and provide a button to reload the page. -->
      <header class="page-heading">
        <div>
          <p class="eyebrow">Welcome Back</p>
          <h1><span id="student-name-display">Student</span> Dashboard</h1>
          <p class="intro">
            View your classes and manage enrollment.
          </p>
        </div>
        <button class="button button-secondary refresh-button" id="refresh-button" type="button">
          <span aria-hidden="true">↻</span>
          Refresh
        </button>
      </header>

      <p id="status" class="status-message" role="status" aria-live="polite"></p>

      <section class="panel" aria-labelledby="my-classes-heading">
        <h2 id="my-classes-heading">My Classes</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Class</th>
                <th scope="col">Teacher</th>
                <th scope="col">Time</th>
                <th scope="col">Enrolled / Capacity</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="my-classes-body">
              <tr>
                <td colspan="5" class="table-placeholder">Loading your classes…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel" aria-labelledby="all-classes-heading">
        <h2 id="all-classes-heading">All Classes</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Class</th>
                <th scope="col">Teacher</th>
                <th scope="col">Time</th>
                <th scope="col">Enrolled / Capacity</th>
                <th scope="col">Action</th>
              </tr>
            </thead>
            <tbody id="all-classes-body">
              <tr>
                <td colspan="5" class="table-placeholder">Loading classes…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <form id="logout-form">
        <button class="button button-secondary" type="submit">Log out</button>
      </form>

      <footer class="page-footer">
        <span>Class lists and enrollment changes are loaded from the server.</span>
      </footer>
    </main>
  </body>
</html>
