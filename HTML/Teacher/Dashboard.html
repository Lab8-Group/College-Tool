<!doctype html>
<html lang="en">
  <head>
    <!-- Set page metadata and load the stylesheet and application script. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f3e9" />
    <meta
      name="description"
      content="Look at classes, grades,and manage student enrollment in Teacher Dashboard."
    />
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script src="{{ url_for('static', filename='teacher.js') }}" defer></script>
  </head>
  <body>
    <main class="page-shell">
  <header class="page-heading">
    <div>
      <p class="eyebrow">Teacher</p>
      <h1>Teacher Dashboard</h1>
      <p class="intro">View your classes and manage student grades.</p>
    </div>
  </header>

  <section class="panel" aria-labelledby="classes-heading">
    <h2 id="classes-heading">My Classes</h2>
    <p>Select a class to view its roster.</p>
    <!-- Class list goes here -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Class</th>
        <th scope="col">Time</th>
        <th scope="col">Enrolled / Capacity</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody id="class-list">
  <tr>
    <td colspan="4" class="table-placeholder">Loading your classes…</td>
  </tr>
</tbody>
  </table>
</div>
  </section>

  <section class="panel" aria-labelledby="roster-heading">
    <h2 id="roster-heading">Class Roster</h2>
    <h3 id="selected-course">Select a class</h3>
<p id="roster-status" class="status-message" role="status" aria-live="polite">
  Choose a class above to load its roster.
</p>
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th scope="col">Student</th>
        <th scope="col">Grade</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody id="roster-list">
      <tr>
        <td colspan="3" class="table-placeholder">No roster loaded.</td>
      </tr>
    </tbody>
  </table>
</div>
        </section>
        <form action="{{ url_for('logout') }}" method="post">
        <!-- Include a CSRF token here when CSRF protection is set up.--> 
        <button class="button button-secondary" type="submit">Log out</button>
    </form>
    </main>
</body>
</html>
