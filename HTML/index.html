<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Course Portal</title>
</head>
<body>
    <main>
        <h1>Student Course Portal</h1>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="login-section" aria-labelledby="login-heading">
            <h2 id="login-heading">Log in</h2>
            <form id="login-form">
                <label for="student-name">Name</label>
                <input id="student-name" name="name" type="text" autocomplete="username" required>

                <label for="student-password">Password</label>
                <input id="student-password" name="password" type="password" autocomplete="current-password" required>

                <button type="submit">Log in</button>
            </form>
        </section>

        <section id="student-app" aria-label="Student courses" hidden>
            <p>Signed in as <span id="student-name-display"></span></p>
            <button id="logout-button" type="button">Log out</button>

            <section aria-labelledby="my-courses-heading">
                <h2 id="my-courses-heading">My classes</h2>
                <ul id="my-courses"></ul>
            </section>

            <section aria-labelledby="all-courses-heading">
                <h2 id="all-courses-heading">All classes</h2>
                <ul id="all-courses"></ul>
            </section>
        </section>
    </main>
    <script type="module" src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
