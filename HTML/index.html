<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Course Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="portal-login-page">
    <main class="portal-shell">
        <section class="portal-welcome" aria-labelledby="portal-title">
            <div class="portal-brand">
                <span class="portal-brand-mark" aria-hidden="true">SP</span>
                <span class="portal-brand-name">Campus Access</span>
            </div>

            <div class="portal-welcome-copy">
                <h1 id="portal-title">School<br><span>Portal</span></h1>
                <p class="portal-welcome-description">
                    Welcome to the School Portal. Sign in to view your dashboard.
                </p>
            </div>

            <p class="portal-welcome-footer">Built for learning. Ready for you.</p>
        </section>

        <section id="login-section" class="portal-login" aria-labelledby="login-heading">
            <div class="portal-login-content">
                <p class="eyebrow">WELCOME BACK</p>
                <h2 id="login-heading">Sign in</h2>
                <p class="portal-login-description">
                    Use your account to continue.
                </p>

                <p id="status" class="status-message" role="status" aria-live="polite"></p>

                <form id="login-form" class="portal-login-form">
                    <label class="field" for="student-name">
                        Name
                        <input id="student-name" name="name" type="text" autocomplete="username" placeholder="Your full name" required>
                    </label>

                    <label class="field" for="student-password">
                        Password
                        <input id="student-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                    </label>

                    <button class="button button-primary portal-submit" type="submit">Sign in</button>
                </form>

                <p class="portal-login-note">Your account gives you access to your personalized dashboard.</p>
            </div>
        </section>
    </main>
    <script type="module" src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
